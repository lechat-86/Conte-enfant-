name: Livraison des messages
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
concurrency: fulfill
jobs:
  fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m engine.fulfill && python3 -m engine.followup
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_F: ${{ secrets.ELEVENLABS_VOICE_F }}
          ELEVENLABS_VOICE_M: ${{ secrets.ELEVENLABS_VOICE_M }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          REVIEW_URL: ${{ vars.REVIEW_URL }}
          REVIEW_MODE: ${{ vars.REVIEW_MODE || '1' }}
